<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 id="lvl-title">Level 1</h1>
        <div class="stats">Queue: <span id="q-len" class="highlight">0</span> | Grid: <span id="g-size"
                class="highlight">4x4</span></div>
        <button class="btn btn-gen" onclick="showGeneratorUI()">Generate</button>
        <button class="btn btn-restart" id="btn-restart" onclick="restartLevel()">↻ Restart</button>
    </header>

    <div class="queue-container" id="queue-box"></div>

    <div class="game-view">
        <div class="grid-container" id="grid-box"></div>
        <div class="overlay" id="end-screen">
            <h2 id="end-title" style="color:#2ed573; font-size:2.5rem; margin:0;">CLEARED!</h2>
            <p style="color:#aaa; margin-bottom:20px;">Perfect Sequence.</p>
            <button class="btn" onclick="showGeneratorUI()">New Puzzle</button>
            <button class="btn" style="background:#555; color:#ccc;" onclick="restartLevel()">Replay</button>
        </div>
    </div>

    <div class="toast" id="toast">Pop!</div>

    <!-- Solution Order Display -->
    <div class="solution-box" id="solution-box">
        <div class="solution-title">Solution Order</div>
        <div class="solution-sequence" id="solution-sequence"></div>
    </div>

    <!-- Generator Modal -->
    <div class="modal" id="gen-modal">
        <div class="modal-content modal-content-wide">
            <h3>Level Generator v8</h3>
            <div class="gen-form">
                <!-- Grid Size (Auto 없음 - 기준이 되는 값) -->
                <div class="param-row">
                    <label>
                        <span class="param-label">Grid Size (5-12):</span>
                        <input type="number" id="gen-size" value="8" min="5" max="12" onchange="onGridSizeChange()">
                    </label>
                </div>

                <!-- Target Density -->
                <div class="param-row">
                    <label>
                        <span class="param-label">Target Density:</span>
                        <div class="param-input-group">
                            <input type="range" id="gen-density" value="50" min="20" max="80" class="density-slider" oninput="updateDensityLabel()">
                            <span id="density-label" class="density-label">50%</span>
                        </div>
                    </label>
                </div>

                <div class="section-divider">
                    <span>Queue Settings</span>
                    <label class="auto-all-label">
                        <input type="checkbox" id="auto-all" onchange="toggleAutoAll()">
                        <span>Auto All</span>
                    </label>
                </div>

                <!-- Queue Lanes -->
                <div class="param-row">
                    <label>
                        <span class="param-label">Queue Lanes (1-6):</span>
                        <div class="param-input-group">
                            <input type="number" id="gen-lanes" value="2" min="1" max="6">
                            <label class="auto-checkbox">
                                <input type="checkbox" id="auto-lanes" onchange="onAutoChange('lanes')">
                                <span>Auto</span>
                            </label>
                        </div>
                    </label>
                </div>

                <!-- Balloons per Lane -->
                <div class="param-row">
                    <label>
                        <span class="param-label">Balloons/Lane (1-8):</span>
                        <div class="param-input-group">
                            <input type="number" id="gen-balloons" value="2" min="1" max="8">
                            <label class="auto-checkbox">
                                <input type="checkbox" id="auto-balloons" onchange="onAutoChange('balloons')">
                                <span>Auto</span>
                            </label>
                        </div>
                    </label>
                </div>

                <!-- Miss Arrows -->
                <div class="param-row">
                    <label>
                        <span class="param-label">Miss Arrows (0-10):</span>
                        <div class="param-input-group">
                            <input type="number" id="gen-miss" value="1" min="0" max="10">
                            <label class="auto-checkbox">
                                <input type="checkbox" id="auto-miss" onchange="onAutoChange('miss')">
                                <span>Auto</span>
                            </label>
                        </div>
                    </label>
                </div>

                <div class="section-divider">
                    <span>Arrow Settings</span>
                </div>

                <!-- Min Block Length -->
                <div class="param-row">
                    <label>
                        <span class="param-label">Min Length (1-8):</span>
                        <div class="param-input-group">
                            <input type="number" id="gen-min-len" value="3" min="1" max="8">
                            <label class="auto-checkbox">
                                <input type="checkbox" id="auto-min-len" onchange="onAutoChange('minLen')">
                                <span>Auto</span>
                            </label>
                        </div>
                    </label>
                </div>

                <!-- Max Block Length -->
                <div class="param-row">
                    <label>
                        <span class="param-label">Max Length (2-20):</span>
                        <div class="param-input-group">
                            <input type="number" id="gen-max-len" value="8" min="2" max="20">
                            <label class="auto-checkbox">
                                <input type="checkbox" id="auto-max-len" onchange="onAutoChange('maxLen')">
                                <span>Auto</span>
                            </label>
                        </div>
                    </label>
                </div>

                <div class="section-divider">
                    <span>Advanced</span>
                </div>

                <!-- Bending Mode (ReverseGrowth) -->
                <div class="param-row">
                    <label class="checkbox-label">
                        <span class="param-label">Bending Mode:</span>
                        <input type="checkbox" id="gen-bending" checked>
                    </label>
                    <span class="param-hint">꺾이는 화살표 (미로 형태, 높은 밀도)</span>
                </div>

                <!-- Filler -->
                <div class="param-row">
                    <label class="checkbox-label">
                        <span class="param-label">Enable Filler:</span>
                        <input type="checkbox" id="gen-filler" checked>
                    </label>
                    <span class="param-hint">빈 공간에 장애물 화살표 추가</span>
                </div>

                <!-- Branching Mode -->
                <div class="param-row">
                    <label class="checkbox-label">
                        <span class="param-label">Branching Mode:</span>
                        <input type="checkbox" id="gen-branching">
                    </label>
                    <span class="param-hint">여러 화살표 동시 탈출 가능</span>
                </div>
            </div>

            <div class="modal-buttons">
                <button class="btn" onclick="runGenerator()">Generate</button>
                <button class="btn btn-cancel" onclick="closeGeneratorUI()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="generator.js"></script>
    <script src="game.js"></script>
</body>

</html>
